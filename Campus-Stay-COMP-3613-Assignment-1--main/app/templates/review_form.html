{% extends "base.html" %}
{% block title %}Review your stay{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Review your stay</h1>
  <p class="muted">{{ booking.accommodation.title }} · {{ booking.start_date | fmt_date }} → {{ booking.end_date | fmt_date }}</p>
  <form method="post" action="/bookings/{{ booking.id }}/review" class="form">
    <fieldset class="role-pick">
      <legend>Your rating</legend>
      {% for n in [5, 4, 3, 2, 1] %}
        <label><input type="radio" name="rating" value="{{ n }}" {{ 'checked' if form.rating == n|string }} required> {{ '★' * n }}</label>
      {% endfor %}
    </fieldset>
    <label>What was it like? <textarea name="comment" rows="5" maxlength="1000" required placeholder="Noise, landlord, internet, commute…">{{ form.comment or '' }}</textarea></label>
    <button class="btn btn-primary" type="submit">Publish review</button>
    <a class="btn btn-ghost" href="/my/bookings">Cancel</a>
  </form>
</div>
{% endblock %}
