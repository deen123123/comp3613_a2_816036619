{% extends "base.html" %}
{% block title %}Ops console{% endblock %}
{% block content %}
<h1>Ops console</h1>
{% if not authed %}
  <form method="post" action="/config" class="form auth-card card">
    <label>Config password <input type="password" name="password" required></label>
    <button class="btn btn-primary" type="submit">Unlock</button>
  </form>
{% else %}
  <div class="card">
    <table>{% for k, v in info.items() %}<tr><th>{{ k }}</th><td>{{ v }}</td></tr>{% endfor %}</table>
  </div>
  <p class="stats">{% for k, v in stats.items() %}<span><strong>{{ v }}</strong> {{ k }}</span>{% endfor %}</p>
{% endif %}
{% endblock %}
