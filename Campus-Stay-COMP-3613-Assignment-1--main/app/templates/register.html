{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Create your account</h1>
  <form method="post" action="/register" class="form">
    <fieldset class="role-pick">
      <legend>I am a…</legend>
      <label><input type="radio" name="role" value="student" {{ 'checked' if form.role != 'landlord' }}> Student</label>
      <label><input type="radio" name="role" value="landlord" {{ 'checked' if form.role == 'landlord' }}> Landlord</label>
    </fieldset>
    <label>Full name <input name="full_name" value="{{ form.full_name or '' }}" required></label>
    <label>Username <input name="username" value="{{ form.username or '' }}" autocomplete="username" required></label>
    <label>Email <input type="email" name="email" value="{{ form.email or '' }}" required></label>
    <label>Phone (optional) <input name="phone" value="{{ form.phone or '' }}"></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
    <button class="btn btn-primary" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}
